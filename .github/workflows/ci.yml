name: StockSense AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Backend CI (Node.js 20, PostgreSQL 16, Redis 7)
  # -------------------------------------------------------------
  backend-test:
    name: Backend Tests & Database Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocksense_test_db
          POSTGRES_USER: stocksense_user
          POSTGRES_PASSWORD: stocksense_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Integration & Unit Tests
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://stocksense_user:stocksense_password@localhost:5432/stocksense_test_db?schema=public
          TEST_DATABASE_URL: postgresql://stocksense_user:stocksense_password@localhost:5432/stocksense_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_must_be_sufficiently_long_for_security_testing_purpose_32chars
          APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CSRF_SECRET: test_csrf_secret_32_characters_long_min_len
        run: npm test

  # -------------------------------------------------------------
  # 2. Frontend CI (Node.js 20, Vite Build & Test)
  # -------------------------------------------------------------
  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit & Component Tests
        run: npm test

      - name: Verify Production Bundle Build
        run: npm run build

  # -------------------------------------------------------------
  # 3. Machine Learning Microservice CI (Python 3.14, Pytest)
  # -------------------------------------------------------------
  ml-service-test:
    name: ML Service Tests & Champion Registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux OpenMP Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML Service Test Suite
        run: pytest tests/

  # -------------------------------------------------------------
  # 4. End-to-End Browser Automation CI (Playwright, Chromium)
  # -------------------------------------------------------------
  playwright-e2e:
    name: Playwright Browser E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        env:
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload Playwright Test Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------
  # 5. Multi-Stage Docker Build Verification
  # -------------------------------------------------------------
  docker-build-verification:
    name: Docker Container Multi-Stage Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ml-service-test, playwright-e2e]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: stocksense-frontend:test

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: stocksense-backend:test

      - name: Build ML Service Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: false
          tags: stocksense-ml-service:test
