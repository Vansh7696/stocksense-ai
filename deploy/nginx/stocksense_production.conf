# ==============================================================================
# StockSense AI — Production TLS/HTTPS Nginx Reverse Proxy Configuration
# Enforces HTTP-to-HTTPS 301 redirect, TLSv1.2/1.3, modern cipher suite,
# HSTS preload, ACME challenge support, and defense-in-depth security headers.
# ==============================================================================

# Rate limiting zones to mitigate layer-7 volumetric DoS attacks
limit_req_zone $binary_remote_addr zone=stocksense_api_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=stocksense_conn_zone:10m;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80): ACME Validation & HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stocksense.ai www.stocksense.ai;

    # Certbot / Let's Encrypt ACME HTTP-01 webroot challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        access_log off;
    }

    # Internal health check for container orchestration
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Unconditional permanent redirect to HTTPS for all other traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443): Hardened TLS & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stocksense.ai www.stocksense.ai;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/stocksense.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocksense.ai/privkey.pem;

    # TLS Protocols: Restrict exclusively to modern, cryptographically secure versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Session resumption and performance optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling for automated revocation status verification
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS): 1 year + includeSubDomains + preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Defensive Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # Document root for React SPA production build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # Static assets caching (Vite hashed bundles in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Backend API Reverse Proxy
    location /api/ {
        limit_req zone=stocksense_api_zone burst=20 nodelay;
        limit_conn stocksense_conn_zone 15;

        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
